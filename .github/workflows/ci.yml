name: CI

# every branch, so that one pushed for review shows its checks before a merge,
# and every release, which runs it first on the commit it tags
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
            tools/go.sum

      # a cgo dependency must fail on the pull request that introduces it
      - name: Build (CGO-free)
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          go -C server build ./...
          go -C cmd/tinystore build ./...

      # the race detector needs cgo, which the windows runner cannot provide
      - name: Test
        if: matrix.os == 'windows-latest'
        run: |
          go test -shuffle=on ./...
          go -C server test -shuffle=on ./...
          go -C cmd/tinystore test -shuffle=on ./...

      - name: Test (race)
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: 1
        run: |
          go test -race -shuffle=on ./...
          go -C server test -race -shuffle=on ./...
          go -C cmd/tinystore test -race -shuffle=on ./...

  sdk:
    name: sdk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/tinystore/go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
            cmd/tinystore/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@v10.2.0

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # each platform reaches its server another way: a named pipe on
      # Windows, a Unix socket elsewhere
      - name: Check and test the SDKs
        run: task sdk

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
            tools/go.sum

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned tools
        run: task setup

      - name: Formatting
        run: task fmt:check

      # build tags hide each platform's files from another's lint
      - name: Lint
        run: task lint:platforms

      # a release workflow that does not parse fails only when a release needs it
      - name: Workflows
        run: task lint:actions

      - name: Vulnerabilities
        run: task vuln

      # naming the shell is what adds pipefail, without which tee hides a failure
      - name: Import weight
        shell: bash
        run: task size | tee -a "$GITHUB_STEP_SUMMARY"

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
            tools/go.sum

      - name: Verify the module files are tidy
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff
          go -C server mod tidy -diff
          go -C cmd/tinystore mod tidy -diff
