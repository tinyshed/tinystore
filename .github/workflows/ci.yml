name: CI

# every branch, so that one pushed for review shows its checks before a merge,
# and every release, which runs it first on the commit it tags
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the release and its components
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # without it SQLite's Unix VFS calls fsync for fdatasync, which cost a
      # 64 KiB set 1.5x (research kv-optimization-2026-10-09)
      - name: SQLite's flags on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo 'LIBSQLITE3_FLAGS=SQLITE_DQS=0 -DHAVE_FDATASYNC=1' >> "$GITHUB_ENV"

      # each platform's code is linted where it compiles: cfg hides it elsewhere
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build the core's library and tinystore
        run: cargo build --release --locked -p tinystore-ffi -p tinystore-cli

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # kv and jobs through the core in Bun's process, a private child, a sidecar and a remote server
      - name: Bun over the core and tinystore serve
        shell: bash
        working-directory: sdk/js
        run: |
          case "$RUNNER_OS" in
            Windows) library=tinystore_ffi.dll binary=tinystore.exe ;;
            macOS) library=libtinystore_ffi.dylib binary=tinystore ;;
            *) library=libtinystore_ffi.so binary=tinystore ;;
          esac
          bun install --frozen-lockfile
          export TINYSTORE_LIBRARY="$GITHUB_WORKSPACE/target/release/$library"
          export TINYSTORE_BIN="$GITHUB_WORKSPACE/target/release/$binary"
          bun test test/pipe.test.ts test/kv.test.ts test/jobs.test.ts test/sql.test.ts test/clock.test.ts test/protocol.test.ts

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      # every codec and vector is what protocol/*.wire writes
      - name: Protocol
        run: cargo run --locked -p tinystore-protocol -- --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: The Bun SDK's lint and types
        working-directory: sdk/js
        run: |
          bun install --frozen-lockfile
          bun run check

      # a release workflow that does not parse fails only when a release needs it
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
