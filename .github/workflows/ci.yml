name: CI

# every branch, so that one pushed for review shows its checks before a merge,
# and every release, which runs it first on the commit it tags
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the release and its components
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # without it SQLite's Unix VFS calls fsync for fdatasync, which cost a
      # 64 KiB set 1.5x (research kv-optimization-2026-10-09)
      - name: SQLite's flags on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo 'LIBSQLITE3_FLAGS=SQLITE_DQS=0 -USQLITE_ENABLE_MEMORY_MANAGEMENT SQLITE_ENABLE_DBPAGE_VTAB -DHAVE_FDATASYNC=1' >> "$GITHUB_ENV"

      # each platform's code is linted where it compiles: cfg hides it elsewhere
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # the library built with each engine alone, the console alone, the wire alone and every engine
      # without the wire: a program links what it opens and nothing else
      - name: Lint the library's features alone
        shell: bash
        run: |
          for features in console kv config locks channels jobs sql blobs records metrics system search wire kv,backup kv,channels kv,replication kv,replication,replication-tls kv,config,locks,channels,jobs,sql,blobs,records,metrics,search,backup,replication; do
            cargo clippy -p tinystore --no-default-features --features "$features" --all-targets --locked -- -D warnings
          done

      - name: Test
        run: cargo test --workspace --locked

      - name: Test nodes linked through TLS
        run: cargo test -p tinystore --lib --locked --features replication-tls replication::link_tests::nodes_linked

      - name: Build the core's library and tinystore
        run: cargo build --release --locked -p tinystore-ffi -p tinystore-cli

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # every engine through the core in Bun's process, a private child, a sidecar and a remote server
      - name: Bun over the core and tinystore serve
        shell: bash
        working-directory: sdk/js
        run: |
          case "$RUNNER_OS" in
            Windows) library=tinystore_ffi.dll binary=tinystore.exe ;;
            macOS) library=libtinystore_ffi.dylib binary=tinystore ;;
            *) library=libtinystore_ffi.so binary=tinystore ;;
          esac
          bun install --frozen-lockfile
          export TINYSTORE_LIBRARY="$GITHUB_WORKSPACE/target/release/$library"
          export TINYSTORE_BIN="$GITHUB_WORKSPACE/target/release/$binary"
          bun test test/pipe.test.ts test/kv.test.ts test/jobs.test.ts test/sql.test.ts test/blobs.test.ts test/queries.test.ts test/clock.test.ts test/direct.test.ts test/durability.test.ts test/encrypted.test.ts test/protocol.test.ts test/console.test.ts test/events.test.ts test/logger.test.ts test/background.test.ts test/metrics.test.ts test/config.test.ts test/backup.test.ts test/locks.test.ts test/channels.test.ts test/search.test.ts test/node.test.ts test/values.test.ts

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod

      # the Go SDK through the core in its own process, a private child, a sidecar and a remote server:
      # the core through syscall on Windows and cgo elsewhere
      - name: Go over the core and tinystore serve
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) library=tinystore_ffi.dll binary=tinystore.exe ;;
            macOS) library=libtinystore_ffi.dylib binary=tinystore ;;
            *) library=libtinystore_ffi.so binary=tinystore ;;
          esac
          export TINYSTORE_LIBRARY="$GITHUB_WORKSPACE/target/release/$library"
          export TINYSTORE_BIN="$GITHUB_WORKSPACE/target/release/$binary"
          cd sdk/go
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - uses: astral-sh/setup-uv@v10.2.0

      # the Python SDK through the core in its own process, a private child, a sidecar and a remote server;
      # its module is the core's library built again with python, after Bun's own has been used
      - name: Python over the core and tinystore serve
        shell: bash
        env:
          PYO3_BUILD_EXTENSION_MODULE: '1'
        run: |
          case "$RUNNER_OS" in
            Windows) library=tinystore_ffi.dll module=_core.pyd binary=tinystore.exe ;;
            macOS) library=libtinystore_ffi.dylib module=_core.abi3.so binary=tinystore ;;
            *) library=libtinystore_ffi.so module=_core.abi3.so binary=tinystore ;;
          esac
          cargo build --release --locked -p tinystore-ffi --features python
          cp "target/release/$library" "sdk/python/src/tinystore/$module"
          export TINYSTORE_BIN="$GITHUB_WORKSPACE/target/release/$binary"
          cd sdk/python
          uv run --frozen pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # the Bun SDK's suites under Node, through its core as Node's addon, a private child, a sidecar
      # and a remote server; last, since the addon is the core's library built again
      - name: Node over its addon and tinystore serve
        shell: bash
        working-directory: sdk/js
        run: |
          case "$RUNNER_OS" in
            Windows) library=tinystore_ffi.dll binary=tinystore.exe ;;
            macOS) library=libtinystore_ffi.dylib binary=tinystore ;;
            *) library=libtinystore_ffi.so binary=tinystore ;;
          esac
          cargo build --release --locked -p tinystore-ffi --features node
          cp "$GITHUB_WORKSPACE/target/release/$library" "$GITHUB_WORKSPACE/target/release/tinystore.node"
          export TINYSTORE_ADDON="$GITHUB_WORKSPACE/target/release/tinystore.node"
          export TINYSTORE_BIN="$GITHUB_WORKSPACE/target/release/$binary"
          node --test --test-timeout=60000 --import ./test/node/register.ts test/pipe.test.ts test/kv.test.ts test/jobs.test.ts test/sql.test.ts test/blobs.test.ts test/queries.test.ts test/clock.test.ts test/direct.test.ts test/durability.test.ts test/encrypted.test.ts test/protocol.test.ts test/console.test.ts test/events.test.ts test/logger.test.ts test/background.test.ts test/metrics.test.ts test/config.test.ts test/backup.test.ts test/locks.test.ts test/channels.test.ts test/search.test.ts test/node.test.ts test/values.test.ts
          node --test test/under-node.ts

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      # every codec and vector is what protocol/*.wire writes
      - name: Protocol
        run: cargo run --locked -p tinystore-protocol -- --check

      - uses: astral-sh/setup-uv@v10.2.0

      # the Go and Python codecs read and write every vector; the runner has Go
      - name: Codecs
        run: |
          (cd sdk/go/internal/wire && go vet . && go test .)
          (cd sdk/python && uv run --frozen pytest tests/test_protocol.py --noconftest -q)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: The Python SDK's lint and types
        working-directory: sdk/python
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
          uv run --frozen pyright

      - name: The Bun SDK's lint and types
        working-directory: sdk/js
        run: |
          bun install --frozen-lockfile
          bun run check

      # a release workflow that does not parse fails only when a release needs it
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
