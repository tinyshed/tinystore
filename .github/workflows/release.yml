name: Release

# A release is one run of this workflow, dispatched with its version, as
# the release skill says. CI runs on the commit unless a push passed it already;
# seven builds make each target's executable and core, one job packs them, and
# a smoke test on each platform installs what was packed. Nothing leaves before
# that has passed. Asked to publish, and approved in the release environment,
# it pushes the tags, publishes npm, PyPI, crates.io and the server image, and
# makes the GitHub release last, once everything it announces is there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The release, such as v0.1.0 or v0.1.0-rc.6
        required: true
      publish:
        description: Push the tags and publish; otherwise build and try, and keep the artifacts only
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time, never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CRATES_AGENT: tinystore-release (https://github.com/tinyshed/tinystore)

jobs:
  # a commit whose push CI passed needs no second run of it
  passed:
    name: CI passed already
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      ci: ${{ steps.find.outputs.ci }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count)
          if [ "$runs" -gt 0 ]; then echo "ci=passed" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: passed
    if: needs.passed.outputs.ci != 'passed'
    uses: ./.github/workflows/ci.yml

  # the version is new everywhere and after what was published, before
  # anything is built; npm holds the Go engine's candidates up to 0.1.0-rc.5
  version:
    name: the version is new
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - id: check
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "a version is vX.Y.Z, or with -alpha.N, -beta.N or -rc.N: not $VERSION"; exit 1 ;;
          esac
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "a release is published from main, not $GITHUB_REF"; exit 1
          fi
          plain="${VERSION#v}"
          python="${plain/-alpha./a}"; python="${python/-beta./b}"; python="${python/-rc./rc}"
          if npm view "@tinyshed/tinystore@$plain" version >/dev/null 2>&1; then
            echo "npm has @tinyshed/tinystore@$plain already"; exit 1
          fi
          if curl -fsS -o /dev/null "https://pypi.org/pypi/tinyshed-tinystore/$python/json"; then
            echo "PyPI has tinyshed-tinystore $python already"; exit 1
          fi
          # crates.io refuses a request without a User-Agent that names its sender
          if curl -fsS -o /dev/null -A "$CRATES_AGENT" "https://crates.io/api/v1/crates/tinystore/$plain"; then
            echo "crates.io has tinystore $plain already"; exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$VERSION" >/dev/null; then
            echo "the tag $VERSION exists already"; exit 1
          fi
          case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  # Each target on its own machine: Linux's inside the image whose C library it
  # links, through docker run, since a job container of Alpine on arm64 runs no
  # JavaScript action; macOS's Intel build on Apple silicon, cross.
  build:
    name: build ${{ matrix.target }}
    needs: [passed, ci, version]
    if: >-
      !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success'
      || needs.ci.result == 'skipped' && needs.passed.outputs.ci == 'passed')
    runs-on: ${{ matrix.runner }}
    strategy:
      # every target's failure seen in one run, not the first alone
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, image: quay.io/pypa/manylinux_2_28_aarch64 }
          - { target: linux-x64-musl, runner: ubuntu-24.04, triple: x86_64-unknown-linux-musl, image: 'alpine:3.22' }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl, image: 'alpine:3.22' }
          - { target: darwin-arm64, runner: macos-15, triple: aarch64-apple-darwin }
          - { target: darwin-x64, runner: macos-15, triple: x86_64-apple-darwin }
          - { target: win32-x64, runner: windows-2025, triple: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v7

      - name: Build in ${{ matrix.image }}
        if: matrix.image != ''
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION -e TARGET -e TRIPLE "$IMAGE" sh tools/native.sh
          sudo chown -R "$(id -u):$(id -g)" native

      - name: Build
        if: matrix.image == ''
        shell: bash
        run: sh tools/native.sh

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: native/${{ matrix.target }}
          if-no-files-found: error

  # Each job past the builds says when it runs: by default a job is skipped
  # once any job before it was, and ci is whenever a push passed it already.
  package:
    name: pack
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native

      - name: Each target under its name
        run: for dir in native/native-*; do mv "$dir" "native/${dir#native/native-}"; done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pack
        run: |
          (cd sdk/js && bun install --frozen-lockfile)
          bun tools/release.ts --version "$VERSION" --native native --out dist

      - uses: actions/attest-build-provenance@v4
        if: inputs.publish
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/npm/*.tgz
            dist/pypi/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # what a program meets first, from Node, Bun and Python, where each is installed
  smoke:
    name: try ${{ matrix.target }}
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install and open a store
        shell: bash
        run: sh tools/smoke.sh dist

  # musl's packages from Node on Alpine, where a JavaScript action runs no step
  smoke-musl:
    name: try ${{ matrix.target }}
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-musl, runner: ubuntu-24.04 }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install and open a store on Alpine
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION -e TARGET node:24-alpine \
            sh -c 'apk add --no-cache uv >/dev/null && sh tools/smoke.sh dist'

  # the first step that cannot be taken back: the environment's reviewers
  # approve it, having seen what the build made and the smoke test tried
  tags:
    name: push the tags
    if: ${{ !cancelled() && inputs.publish && needs.smoke.result == 'success' && needs.smoke-musl.result == 'success' }}
    needs: [smoke, smoke-musl]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Push the release's tag and the Go SDK's, both or neither
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "TinyStore $VERSION" "$GITHUB_SHA"
          git tag -a "sdk/go/$VERSION" -m "TinyStore's Go SDK $VERSION" "$GITHUB_SHA"
          git push --atomic origin "refs/tags/$VERSION" "refs/tags/sdk/go/$VERSION"

  npm:
    name: npm
    needs: [version, tags]
    if: ${{ !cancelled() && needs.tags.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The platforms first, so that the SDK never names a package not there
      # yet; one published by an earlier attempt is left as it is, since npm
      # refuses a version twice. A token only until trusted publishing is set
      # up for each package.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          sdk="dist/npm/tinyshed-tinystore-${VERSION#v}.tgz"
          test -f "$sdk"
          platforms=()
          for package in dist/npm/*.tgz; do
            if [ "$package" != "$sdk" ]; then platforms+=("$package"); fi
          done
          # Until a release that is not a pre-release exists, latest follows the
          # newest pre-release too, or a plain `npm install` keeps the first one.
          stable=$(npm view @tinyshed/tinystore versions --json 2>/dev/null | node -p 'const v = JSON.parse(require("fs").readFileSync(0) || "[]"); [].concat(v).some(x => !x.includes("-"))')
          tags=("$DIST_TAG")
          if [ "$DIST_TAG" = next ] && [ "$stable" != true ]; then tags+=(latest); fi
          for package in "${platforms[@]}" "$sdk"; do
            named=$(tar -xzOf "$package" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')
            if npm view "$named" version >/dev/null 2>&1; then
              echo "$named is published already"
            else
              npm publish "$package" --access public --provenance --tag "$DIST_TAG"
            fi
            for tag in "${tags[@]}"; do npm dist-tag add "$named" "$tag"; done
          done

  pypi:
    name: PyPI
    needs: tags
    if: ${{ !cancelled() && needs.tags.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/
          skip-existing: true

  # The library, then the command that names it at the same version, each
  # built from the stamped source as cargo publish verifies it; one published
  # by an earlier attempt is left as it is, since crates.io refuses a version
  # twice. A token only until each crate trusts release.yml, which crates.io
  # allows once a crate exists.
  crates:
    name: crates.io
    needs: tags
    if: ${{ !cancelled() && needs.tags.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: crates
    permissions:
      contents: read
      id-token: write
    env:
      TOKEN_GIVEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the version
        run: sh tools/stamp.sh

      - id: auth
        if: env.TOKEN_GIVEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          plain="${VERSION#v}"
          for crate in tinystore tinystore-cli; do
            if curl -fsS -o /dev/null -A "$CRATES_AGENT" "https://crates.io/api/v1/crates/$crate/$plain"; then
              echo "$crate $plain is published already"
            else
              # dirty with the stamp alone, which tools/stamp.sh checks took
              cargo publish --locked --allow-dirty -p "$crate"
            fi
          done

  image:
    name: server image
    needs: [version, tags]
    if: ${{ !cancelled() && needs.tags.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # the attestation's record of where the image is kept
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # the image carries the archives' own executables, the ones attested
      - name: The image's files
        run: |
          plain="${VERSION#v}"
          mkdir -p image/data
          for arch in amd64 arm64; do
            target=linux-x64; if [ "$arch" = arm64 ]; then target=linux-arm64; fi
            mkdir -p "image/$arch"
            tar -xzf "dist/tinystore-$plain-$target.tar.gz" -C "image/$arch" --strip-components 2 \
              "tinystore-$plain-$target/bin/tinystore"
          done
          cp tools/Dockerfile image/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # last, so that what it announces is all there
  github:
    name: GitHub release
    needs: [version, npm, pypi, crates, image]
    if: >-
      ${{ !cancelled() && needs.npm.result == 'success' && needs.pypi.result == 'success'
      && needs.crates.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the release $VERSION exists already"; exit 0
          fi
          kind=()
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease); fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" \
            --notes-file dist/NOTES.md "${kind[@]}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS
