# only what go vet and go fix do not already cover, see AGENTS.md
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck        # unchecked errors
    - govet           # all analyzers, including those `go test` skips
    - ineffassign     # assignments never used
    - staticcheck     # SA/S/ST/QF checks
    - unused          # unused private identifiers

    - errorlint       # correct errors.Is/As/%w usage
    - nilerr          # `return nil` after a non-nil error

    - bodyclose       # unclosed http.Response.Body
    - rowserrcheck    # unchecked sql.Rows.Err()
    - sqlclosecheck   # unclosed sql.Rows/sql.Stmt

    # the query pipeline is built on cancellation
    - contextcheck
    - noctx           # HTTP requests built without a context

    - gosec
    - misspell
    - revive
    - unconvert
    - wastedassign

    # readability gates of docs/rewrite.md
    - lll
    - funlen
    - gocognit

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment  # too noisy; revisit only for hot-path structs
    errcheck:
      check-type-assertions: true
      check-blank: true
    staticcheck:
      checks:
        - all
    revive:
      rules:
        # `exported` is deliberately absent: demanding a comment on every
        # exported name manufactures restatement, see AGENTS.md
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
    gosec:
      excludes:
        - G104  # duplicate of errcheck
    lll:
      line-length: 120
      tab-width: 4
    funlen:
      lines: 60
      statements: -1
      ignore-comments: true   # a worked example is not length
    gocognit:
      min-complexity: 30

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gosec
          - noctx
          - bodyclose
          - lll
          - funlen
          - gocognit

      # debt the rewrite has not paid yet, see docs/rewrite.md; delete an entry once it passes
      - path: (internal/sizeprobe/(main|report/main)|metrics/(binary|options|store|types|values_changes))\.go$
        linters:
          - lll
      - text: '[`''.](decodeResiduals|decodeBlock|changeValues|readChanges)[`'']'
        linters:
          - funlen
          - gocognit

formatters:
  enable:
    - gofumpt         # stricter superset of gofmt
    - goimports       # import grouping/ordering, which gofmt does not do
  settings:
    goimports:
      local-prefixes:
        - github.com/tinyshed/tinystore
