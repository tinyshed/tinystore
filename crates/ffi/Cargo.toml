[package]
name = "tinystore-ffi"
description = "TinyStore's way in for another language's process: the C ABI's four functions, and Python's module and Node's addon over the same pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# tinystore_ffi.dll, libtinystore_ffi.so and .dylib for bun:ffi, the .a for cgo;
# built with python, the same library is the Python SDK's tinystore._core
crate-type = ["cdylib", "staticlib"]

[features]
# the pipe as a Python extension module, one abi3 build for every CPython from
# 3.12; it links Python, so the library Bun and Go load is built without it
python = ["dep:pyo3"]
# the pipe as Node's addon, tinystore.node, through Node-API; Node's symbols
# come from the process that loads it, so it too is a build apart from Bun's
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
tinystore = { path = "../tinystore" }
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }
napi = { version = "3.14.2", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3.6.12", optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
