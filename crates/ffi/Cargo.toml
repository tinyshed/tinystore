[package]
name = "tinystore-ffi"
description = "TinyStore's way in for another language's process: the C ABI's four functions, and Python's module over the same pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# tinystore_ffi.dll, libtinystore_ffi.so and .dylib for bun:ffi, the .a for cgo;
# built with python, the same library is the Python SDK's tinystore._core
crate-type = ["cdylib", "staticlib"]

[features]
# the pipe as a Python extension module, one abi3 build for every CPython from
# 3.12; it links Python, so the library Bun and Go load is built without it
python = ["dep:pyo3"]

[dependencies]
tinystore = { path = "../tinystore" }
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
