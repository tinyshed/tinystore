[package]
name = "tinystore-cli"
description = "The tinystore command: a store's directory served to other processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sqlite", "server", "database", "cli"]
categories = ["command-line-utilities", "database"]
publish = true

[[bin]]
name = "tinystore"
path = "src/main.rs"

[dependencies]
tinystore.workspace = true
# the server's sockets and pipes; the library itself runs no async runtime
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "signal", "sync", "time"] }
# a remote server's TLS, with ring's cryptography: it builds with a C compiler alone
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = { version = "0.3", features = ["std"] }
serde_json = "1.0.151"
# a node's settings file, --node-config, and the values a command reads of a store
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "0.9.12", default-features = false, features = ["std", "parse", "serde"] }
# the server's lines in a person's terminal: colours, and a Windows console's switch for them
nu-ansi-term = "0.50.3"
# a person's terminal reads the local time; a file, UTC
jiff = "0.2.38"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

# the DACL that keeps a server's SERVE and pipe to its user: the release tokio
# already builds, and no crate wraps a security descriptor safely
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27"
rcgen = "0.14.10"

# a local user made and logged on, to prove it is refused
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_NetManagement"] }
