[package]
name = "tinystore"
description = "An embedded data runtime on SQLite: KV, jobs, SQL, blobs, records and metrics in one directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["kv", "jobs", "sql", "blobs", "records", "metrics", "wire"]
# Each engine is a feature: a program links the engines it opens. Every engine
# stands on the store, its directory and SQLite; the console alone does not.
store = ["dep:rusqlite"]
kv = ["store", "dep:chacha20poly1305", "dep:sha2"]
jobs = ["store", "dep:jiff"]
sql = ["store"]
blobs = ["store", "dep:sha2", "dep:libc"]
# a logger's lines printed, which a store's logger keeps too
console = ["dep:jiff", "dep:tracing-subscriber"]
records = ["store", "dep:zstd", "console"]
metrics = ["store", "dep:zstd", "dep:sha2"]
# the protocol's session and the pipe, which the server, the FFI and every SDK
# speak, for the engines built beside it; its session answers kv in every call
wire = ["kv"]
# the bodies of the fuzz targets in fuzz/, which reach decoders the library
# keeps to itself
fuzzing = ["records"]

[dependencies]
# The SQLite build is pinned: the bundled amalgamation of this exact release, the
# flags in .cargo/config.toml, and nothing loaded at run time.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "column_decltype", "hooks", "limits"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# a logger is a layer of the registry every tracing program already has
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
# raw_value: a job's JSON from another language is checked and kept as it came
serde_json = { version = "1.0.151", features = ["raw_value"] }
# a cron's wall clock in its IANA zone: the system's zone database first, the
# bundled one where there is none, on Windows and in a slim container
jiff = { version = "0.2.38", optional = true, features = ["tzdb-bundle-always"] }
# a file's SHA-256, taken as its bytes are written and checked on a whole read,
# and the id of the store's encryption key: RustCrypto's, with the processor's SHA
# instructions where it has them
sha2 = { version = "0.11.0", default-features = false, optional = true }
# the values of an encrypted bucket, sealed with the store's encryption key:
# XChaCha20-Poly1305, RustCrypto's, its key and nonces from the system's source
chacha20poly1305 = { version = "0.11.0", optional = true }
# the rows of records: libzstd, built with the crate and linked into it, its
# frames any Zstandard decoder reads
zstd = { version = "0.14.2", optional = true, default-features = false }

# the disk's free space, which blobs keep some of: statvfs, and statfs on
# Apple's systems; Windows asks kernel32, which every program links
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27"
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
