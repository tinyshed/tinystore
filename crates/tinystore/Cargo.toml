[package]
name = "tinystore"
description = "A small storage runtime for applications on SQLite: SQL, key-value state, durable jobs, files, search, logs and metrics in one directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tinystore"
readme = "README.md"
keywords = ["sqlite", "embedded", "kv", "jobs", "metrics"]
categories = ["database-implementations", "database"]
publish = true

[features]
default = ["kv", "config", "locks", "channels", "jobs", "sql", "blobs", "records", "metrics", "system", "search", "backup", "replication", "wire"]
# Each engine is a feature: a program links the engines it opens. Every engine
# stands on the store, its directory and SQLite; the console alone does not.
store = ["dep:rusqlite"]
kv = ["store", "dep:chacha20poly1305", "dep:sha2"]
# a program's settings, kept in kv.db, and the parsers of the files that give them
config = ["kv", "dep:toml", "dep:yaml-rust2", "typos"]
# locks and semaphores in the memory of the store's process, their fences
# from an epoch kept in kv.db
locks = ["kv"]
# messages published to whoever listens now, in memory, those of a
# transaction released at its commit
channels = ["store"]
jobs = ["store", "dep:jiff"]
sql = ["store"]
blobs = ["store", "dep:sha2", "dep:libc"]
# a backup of every engine as one zip, checked by SHA-256, and its restore
backup = ["store", "dep:sha2"]
# a store a node: a log of each file's commits, entries chained by SHA-256
replication = ["store", "dep:sha2", "dep:zstd", "dep:libc"]
# a node's links through TLS, rustls with ring's cryptography: off unless asked,
# a dependency every program linking it would pay for
replication-tls = ["replication", "dep:rustls"]
# a logger's lines printed, which a store's logger keeps too
console = ["dep:jiff", "dep:tracing-subscriber"]
records = ["store", "dep:zstd", "console"]
metrics = ["store", "dep:zstd", "dep:sha2", "dep:metrics", "dep:libc"]
# the machine a store runs on among its own metrics: its process's memory and
# processor, the system's memory, swap, processors by core and load
system = ["metrics", "dep:sysinfo"]
# documents found again by their words in search.db, a misspelt word read as
# the index's nearest; a table's row known by its digest
search = ["store", "typos", "dep:unicode-normalization", "dep:unicode-segmentation", "dep:rust-stemmers", "dep:sha2"]
# the protocol's session and the pipe, which the server, the FFI and every SDK
# speak, for the engines built beside it; its session answers kv in every call
wire = ["kv"]
# the words nearest a misspelt one, which config names for a key it does
# not know and the command line for a command; it stands on no store
typos = ["dep:fst", "dep:levenshtein_automata"]
# the bodies of the fuzz targets in fuzz/, which reach decoders the library
# keeps to itself
fuzzing = ["records", "metrics"]

[dependencies]
# The SQLite build is pinned: the bundled amalgamation of this exact release, the
# flags in .cargo/config.toml, and nothing loaded at run time.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "column_decltype", "hooks", "limits"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# a logger is a layer of the registry every tracing program already has
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
# raw_value: a job's JSON from another language is checked and kept as it came
serde_json = { version = "1.0.151", features = ["raw_value"] }
# a cron's wall clock in its IANA zone: the system's zone database first, the
# bundled one where there is none, on Windows and in a slim container
jiff = { version = "0.2.38", optional = true, features = ["tzdb-bundle-always"] }
# a file's SHA-256, taken as its bytes are written and checked on a whole read,
# the id of the store's encryption key, and the digest of a row a table's index
# reads: RustCrypto's, with the processor's SHA instructions where it has them
sha2 = { version = "0.11.0", default-features = false, optional = true }
# the values of an encrypted bucket, sealed with the store's encryption key:
# XChaCha20-Poly1305, RustCrypto's, its key and nonces from the system's source
chacha20poly1305 = { version = "0.11.0", optional = true }
# the rows of records, the runs of metrics and a node's links: libzstd, built
# with the crate and linked into it, its frames any Zstandard decoder reads
zstd = { version = "0.14.2", optional = true, default-features = false }
# a node's links through TLS, with replication-tls: the rustls the command line
# speaks to its remote clients
rustls = { version = "0.23.45", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
# a config's files, parsed by the core so that no program brings a parser and
# every language reads them alike: TOML, and YAML 1.2 without the encodings
# that would cost a megabyte
toml = { version = "0.9.12", default-features = false, features = ["std", "parse", "serde"], optional = true }
yaml-rust2 = { version = "0.13.0", default-features = false, optional = true }
# a misspelt name's nearest words: a dictionary in an FST, read through a
# Levenshtein automaton that counts two letters swapped as one edit
fst = { version = "0.4.7", optional = true, default-features = false }
levenshtein_automata = { version = "0.2.1", optional = true, default-features = false }
# a search's words and a document's: text in NFKC and its words by Unicode's
# rules, and Russian's Snowball stems, the one language search-plan measured
# a stem to help. Pinned, as search-plan measured them: a release that reads
# text otherwise reads every index again
unicode-normalization = { version = "=0.1.25", optional = true, default-features = false, features = ["std"] }
unicode-segmentation = { version = "=1.12.0", optional = true }
rust-stemmers = { version = "=1.2.0", optional = true }
# the facade whose macros a Rust program counts with: the metrics engine is a
# recorder of it, as the logger is a layer of tracing
metrics = { version = "0.24.6", optional = true, default-features = false }
sysinfo = { version = "0.39.6", optional = true, default-features = false, features = ["system"] }

# the disk's free space, which blobs keep some of: statvfs, and statfs on
# Apple's systems; Windows asks kernel32, which every program links
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27"
# a certificate for a test of TLS between nodes
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
