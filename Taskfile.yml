# https://taskfile.dev
version: '3'

# a contributor may keep a local go.work so an editor resolves every module;
# each check here must still see exactly the module graph CI sees
env:
  GOWORK: off

vars:
  BIN: bin
  GOLANGCI: '{{.BIN}}/golangci-lint{{exeExt}}'
  GOVULNCHECK: '{{.BIN}}/govulncheck{{exeExt}}'
  # run by its own module graph, since golangci-lint's in tools/ selects a yaml
  # that actionlint does not build against
  ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  # the Linux the container tasks run in; named volumes keep Go's module and
  # build caches between runs, so a second run compiles only what changed
  GO_IMAGE: golang:1.27
  GO_CACHES: -v tinystore-race-cache:/go -v tinystore-gocache:/root/.cache/go-build

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Build the pinned developer tools into ./bin
    sources:
      - tools/go.mod
      - tools/go.sum
    generates:
      - '{{.GOLANGCI}}'
      - '{{.GOVULNCHECK}}'
    cmds:
      - go -C tools build -o ../{{.GOLANGCI}} github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - go -C tools build -o ../{{.GOVULNCHECK}} golang.org/x/vuln/cmd/govulncheck

  test:
    # measurements skip unless TINYSTORE_SPIKE is set
    desc: Run tests (also runs go vet)
    cmds:
      - go test -shuffle=on ./...
      - go -C server test -shuffle=on ./...
      - go -C cmd/tinystore test -shuffle=on ./...

  test:race:
    # needs a c toolchain, which a cgo-free project never otherwise installs
    desc: Run tests with the race detector (requires a C toolchain)
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race -shuffle=on ./...
      - go -C server test -race -shuffle=on ./...
      - go -C cmd/tinystore test -race -shuffle=on ./...

  race:linux:
    # for a host without cgo, Windows here: CI runs the same on Linux and macOS
    desc: Test every module with the race detector in a Linux container
    cmds:
      - >-
        docker run --rm -v '{{.ROOT_DIR}}:/src' {{.GO_CACHES}} -e GOWORK=off -e CGO_ENABLED=1 -w /src {{.GO_IMAGE}}
        sh -c 'go test -race -shuffle=on ./... && go -C server test -race -shuffle=on ./...
        && go -C cmd/tinystore test -race -shuffle=on ./...'

  test:cover:
    desc: Run tests and write a coverage profile to coverage.out
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out | tail -1

  release:snapshot:
    # needs uv and bun; e.g. task release:snapshot -- v0.1.0
    desc: Build every release artifact into dist/ from the working tree, to try them
    cmds:
      - go run ./internal/release -snapshot -version {{.CLI_ARGS}}

  release:tag:
    # the Release workflow does this in its runner; here only to try it, in a scratch clone
    desc: Make a release's three tags here, unpushed, and a worktree to build it from
    cmds:
      - go run ./internal/release -tag -version {{.CLI_ARGS}}

  size:
    desc: Report what importing the public API costs a cgo-free linux/amd64 binary
    vars:
      PROBE: '{{.BIN}}/sizeprobe'
      BASELINE: '{{.BIN}}/sizeprobe-baseline'
      # task ignores env on a single command, and the report has to run on the host
      TARGET: CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    cmds:
      - mkdir -p {{.BIN}}
      - '{{.TARGET}} go build -trimpath -ldflags="-s -w" -o {{.PROBE}} ./internal/sizeprobe'
      - '{{.TARGET}} go build -trimpath -ldflags="-s -w" -o {{.BASELINE}} ./internal/sizeprobe/baseline'
      - go run ./internal/sizeprobe/report

  lint:
    desc: Run golangci-lint
    deps: [setup]
    cmds:
      - '{{.GOLANGCI}} run ./...'
      - cd server && ../{{.GOLANGCI}} run ./...
      - cd cmd/tinystore && ../../{{.GOLANGCI}} run ./...

  lint:actions:
    # with shellcheck on PATH, as on CI's runners, it checks every run: script too
    desc: Lint the GitHub workflows
    cmds:
      - go run {{.ACTIONLINT}}

  lint:platforms:
    # build tags hide each platform's files from another's lint
    desc: Lint every module as Linux, macOS and Windows build it
    cmds:
      - for: [linux, darwin, windows]
        cmd: GOOS={{.ITEM}} task lint

  fmt:
    desc: Format code (gofumpt + goimports via golangci-lint)
    deps: [setup]
    cmds:
      - '{{.GOLANGCI}} fmt ./...'
      - cd server && ../{{.GOLANGCI}} fmt ./...
      - cd cmd/tinystore && ../../{{.GOLANGCI}} fmt ./...

  fmt:check:
    desc: Verify formatting without writing changes
    deps: [setup]
    cmds:
      - '{{.GOLANGCI}} fmt --diff ./...'
      - cd server && ../{{.GOLANGCI}} fmt --diff ./...
      - cd cmd/tinystore && ../../{{.GOLANGCI}} fmt --diff ./...

  fix:
    desc: Apply Go 1.27 modernizers (go fix)
    cmds:
      - go fix ./...

  vuln:
    desc: Scan dependencies for known vulnerabilities
    deps: [setup]
    cmds:
      - '{{.GOVULNCHECK}} ./...'
      - '{{.GOVULNCHECK}} -C server ./...'
      - '{{.GOVULNCHECK}} -C cmd/tinystore ./...'

  sdk:
    # needs bun, node 22.18 or later, and uv
    desc: Check and test both SDKs against a tinystore built from this repository
    cmds:
      - cd sdk/js && bun install --frozen-lockfile && bun run check && bun test
      # the same SDK under Node, which runs its TypeScript as it is, and the JavaScript npm gets for Node
      - cd sdk/js && node --test test/under-node.ts && bun run build
      - cd sdk/python && uv sync --frozen && uv run ruff format --check . && uv run ruff check . && uv run pyright && uv run pytest -q --cov

  sdk:linux:
    # the repository is copied in, so the host's node_modules and .venv stay its own
    desc: Check and test both SDKs in a Linux container, as task sdk does
    cmds:
      - docker build -q -t tinystore-sdk-test -f sdk/test.Dockerfile sdk
      - >-
        docker run --rm -v '{{.ROOT_DIR}}:/src:ro' {{.GO_CACHES}} -v tinystore-sdk-cache:/root/.cache/sdk
        -e UV_CACHE_DIR=/root/.cache/sdk/uv -e UV_PYTHON_INSTALL_DIR=/root/.cache/sdk/python
        -e BUN_INSTALL_CACHE_DIR=/root/.cache/sdk/bun -e GOWORK=off -w /work tinystore-sdk-test
        sh -c 'tar -C /src --exclude=./.git --exclude=./go.work* --exclude=node_modules --exclude=.venv --exclude=./bin
        --exclude=./dist -cf - .
        | tar -xf - && go -C tools build -o /usr/local/bin/task github.com/go-task/task/v3/cmd/task && task sdk'

  web:
    # needs bun, and go for the server's test against a real store
    desc: Check, test and build the docs site in web/, as CI's web job does
    dir: web
    cmds:
      - bun install --frozen-lockfile
      - bun run check
      - bun test
      - bun run build

  web:dev:
    # docs/ is watched too: a markdown change reloads the page
    desc: Run the docs site with live reload on :5173
    dir: web
    cmds:
      - bun install
      - bun run dev

  web:serve:
    # the analytics land in web/data, which `tinystore logs web/data -f` follows
    desc: Serve the last build of the site as production does, through a tinystore built here
    dir: web
    env:
      TINYSTORE_BIN: '{{.ROOT_DIR}}/web/.bin/tinystore{{exeExt}}'
    cmds:
      - go -C ../cmd/tinystore build -o ../../web/.bin/tinystore{{exeExt}} .
      - bun run serve

  web:image:
    desc: Build the docs site's image, the site built first
    cmds:
      - cd web && bun install --frozen-lockfile && bun run build
      - docker build -f web/Dockerfile -t tinystore-site .

  readme:
    # the web tests fail when the README's parts are not what this writes
    desc: Write the landing page's headline, pitch, sample and engines from web/landing.md into the README
    dir: web
    cmds:
      - bun install --frozen-lockfile
      - bun run readme

  tidy:
    desc: Tidy every module file CI checks
    cmds:
      - go mod tidy
      - go -C tools mod tidy
      - go -C server mod tidy
      - go -C cmd/tinystore mod tidy

  tidy:check:
    # -diff reports untidiness without writing, so this does not fail merely
    # because the working tree has uncommitted changes
    desc: Fail when a module file is untidy
    cmds:
      - go mod tidy -diff
      - go -C tools mod tidy -diff
      - go -C server mod tidy -diff
      - go -C cmd/tinystore mod tidy -diff

  check:
    desc: Everything CI gates on
    cmds:
      - task: tidy:check
      - task: fmt:check
      - task: lint:platforms
      - task: lint:actions
      - task: test
      - task: sdk
      - task: web
      - task: vuln
      - task: size

  clean:
    desc: Remove build output
    cmds:
      - go clean -cache -testcache
      - cmd: rm -rf {{.BIN}} coverage.out
        ignore_error: true
