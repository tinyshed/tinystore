[package]
name = "tinystore-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# every engine whose messages the wire's target reads
tinystore = { path = "../crates/tinystore", default-features = false, features = [
    "fuzzing", "kv", "config", "locks", "channels", "jobs", "sql", "blobs", "search", "backup",
] }

# A workspace of its own: the targets build on nightly through cargo-fuzz,
# never with the pinned toolchain the library's workspace builds on.
[workspace]
members = ["."]

[[bin]]
name = "records_lines"
path = "fuzz_targets/records_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metrics_rows"
path = "fuzz_targets/metrics_rows.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metrics_runs"
path = "fuzz_targets/metrics_runs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metrics_text"
path = "fuzz_targets/metrics_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records_rows"
path = "fuzz_targets/records_rows.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_messages"
path = "fuzz_targets/wire_messages.rs"
test = false
doc = false
bench = false
