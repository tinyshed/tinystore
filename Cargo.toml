[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/tinyshed/tinystore"
homepage = "https://tinyshed.org/tinystore"
publish = false

# The library the command line and the FFI build on. crates.io takes a path
# only beside a version: tools/stamp.sh writes the release's here, exact.
[workspace.dependencies]
tinystore = { path = "crates/tinystore", version = "0.0.0" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

# Line tables keep a backtrace's files and lines: the library's test build took
# 1,210 MiB of target/ rather than 2,013 with full debug information, and a
# one-line rebuild 14-20 s either way (three passes each beside other builds,
# Ryzen 7 7700, Windows 11, Rust 1.99: `cargo test -p tinystore --all-features
# --lib --no-run` with CARGO_PROFILE_DEV_DEBUG set and unset).
[profile.dev]
debug = "line-tables-only"
